<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Books - DTECH</title>
    <script src="config.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

    <style>
        :root {
            --primary-color: #00D2FF;
            --primary-hover: #00B4D8;
            --secondary-color: #E0E0E0;
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --border-color: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--secondary-color);
        }

        header {
            background: #000;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            color: var(--primary-color);
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 2rem;
            background: var(--card-bg);
            margin-top: 2rem;
            border-radius: 10px;
        }

        input, button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
        }

        button {
            background: var(--primary-color);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: var(--primary-hover);
        }

        #ocr-result {
            width: 100%;
            height: 120px;
        }

        #image-preview {
            max-width: 100%;
            margin-top: 10px;
        }

        .ocr-container {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: #222;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Back</a>
    <h3>Sell Books</h3>
    <div></div>
</header>

<div class="container">

    <input type="text" id="sellerName" placeholder="Your Name">
    <input type="text" id="contact" placeholder="WhatsApp Number">

    <input type="file" id="image">
    <img id="image-preview">

    <div class="ocr-container" id="ocr-section">
        <p>Extracted Text</p>
        <textarea id="ocr-result" readonly></textarea>
    </div>

    <input type="text" id="title" placeholder="Book Title">
    <input type="text" id="author" placeholder="Author">
    <input type="number" id="price" placeholder="Price">

    <button id="submit-btn">Submit</button>
</div>

<script>
let base64Image = null;
let workerUrl = "";

// Load config
window.appConfigPromise.then(config => {
    workerUrl = config.workerUrl;
});

// 🔥 IMAGE PREPROCESSING (IMPORTANT)
function enhanceImage(imgSrc, callback) {
    const img = new Image();
    img.onload = function () {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            let avg = (data[i] + data[i+1] + data[i+2]) / 3;
            avg = avg > 140 ? 255 : 0;

            data[i] = data[i+1] = data[i+2] = avg;
        }

        ctx.putImageData(imgData, 0, 0);
        callback(canvas.toDataURL());
    };

    img.src = imgSrc;
}

// IMAGE UPLOAD + OCR
document.getElementById("image").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {
        base64Image = event.target.result;

        document.getElementById("image-preview").src = base64Image;

        const ocrBox = document.getElementById("ocr-result");
        document.getElementById("ocr-section").style.display = "block";
        ocrBox.value = "Scanning...";

        // 🔥 enhance first
        enhanceImage(base64Image, async (cleanImg) => {

            const result = await Tesseract.recognize(cleanImg, "eng", {
                logger: m => console.log(m)
            });

            ocrBox.value = result.data.text;
        });
    };

    reader.readAsDataURL(file);
});

// SUBMIT
document.getElementById("submit-btn").addEventListener("click", async () => {

    const payload = {
        seller: document.getElementById("sellerName").value,
        contact: document.getElementById("contact").value,
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        price: document.getElementById("price").value,
        image: base64Image
    };

    const res = await fetch(workerUrl, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.success ? "Uploaded!" : data.error);
});
</script>

</body>
</html>
