name: Build Debug APKs

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build App APK
        run: ./gradlew :app:assembleDebug

      - name: Build Admin App APK
        run: ./gradlew :admin-app:assembleDebug

      - name: Build Ambassador App APK
        run: ./gradlew :ambassador-app:assembleDebug

      - name: Copy and Commit Marketplace APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk marketplace.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace.apk
          git commit -m "Update marketplace.apk [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload App APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin App APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-debug
          path: admin-app/build/outputs/apk/debug/admin-app-debug.apk

      - name: Upload Ambassador App APK
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-app-debug
          path: ambassador-app/build/outputs/apk/debug/ambassador-app-debug.apk
